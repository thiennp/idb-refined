<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>idb-refined example</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 1rem auto; padding: 0 1rem; }
      h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end; margin-bottom: 1rem; }
      .toolbar label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.875rem; }
      .toolbar input { padding: 0.4rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.875rem; }
      .toolbar button { padding: 0.5rem 0.75rem; font-size: 0.875rem; border-radius: 4px; border: 1px solid #333; background: #333; color: #fff; cursor: pointer; }
      .toolbar button.secondary { background: #fff; color: #333; }
      .toolbar button.danger { background: #c00; border-color: #c00; color: #fff; }
      .toolbar button:hover { opacity: 0.9; }
      #status { font-size: 0.8rem; color: #666; margin-bottom: 0.5rem; min-height: 1.2em; }
      table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
      th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; }
      th { font-weight: 600; background: #f8f8f8; }
      td.actions { white-space: nowrap; }
      td.actions button { padding: 0.25rem 0.5rem; margin-right: 0.25rem; font-size: 0.75rem; border-radius: 3px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
      td.actions button:hover { background: #f0f0f0; }
      td.actions button.delete { border-color: #c00; color: #c00; }
      td.actions button.delete:hover { background: #fee; }
      .empty { color: #888; font-style: italic; padding: 1rem; text-align: center; }
    </style>
  </head>
  <body>
    <h1>idb-refined live example</h1>
    <p>Add items and see them in the table. Data is stored in IndexedDB with TTL and eviction.</p>
    <div id="status"></div>
    <div class="toolbar">
      <label>
        Id
        <input id="inputId" type="text" placeholder="e.g. 1" />
      </label>
      <label>
        Name
        <input id="inputName" type="text" placeholder="e.g. Alice" />
      </label>
      <label>
        Role
        <input id="inputRole" type="text" placeholder="e.g. admin" />
      </label>
      <button type="button" id="btnAdd">Add</button>
      <button type="button" id="btnRefresh" class="secondary">Refresh</button>
      <button type="button" id="btnDummy" class="secondary">Generate dummy data</button>
      <button type="button" id="btnDeleteDb" class="danger">Delete DB</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Role</th>
          <th>Created</th>
          <th>Expires</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
